name: locked_in
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_svg: ^2.0.17
  lottie: ^2.6.0            # uses archive 3.x, avoids conflict
  sizer: ^2.0.15
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  simple_gradient_text: ^1.3.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.0
  flutter_keyboard_visibility: ^6.0.0
  just_the_tooltip: ^0.0.12
  stepper_list_view: ^0.0.2
  selector_wheel: ^1.1.2
  flutter_staggered_grid_view: ^0.7.0
  delayed_display: ^2.0.0
  modal_progress_hud_nsn: ^0.5.1
  video_player: ^2.9.1
  chewie: ^1.8.3
  webview_flutter: ^4.10.0

  # Forms / Input
  intl_phone_number_field: ^0.1.9
  country_phone_validator: ^1.0.1
  otp_pin_field: ^1.2.9+1
  image_picker: ^1.1.2
  image_cropper: ^8.0.1
  path_provider: ^2.1.4

  # Navigation & Maps
  google_maps_flutter: ^2.12.3
  flutter_polyline_points: ^2.1.0
  geolocator: ^14.0.0
  location: ^8.0.1

  # Networking / Logging
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1
  dio_log: ^2.0.4  
  simple_fontellico_progress_dialog: ^0.3.0
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.1.7

  # Firebase
  firebase_core: ^3.4.0
  firebase_database: ^11.1.1

  # Auth / Local
  local_auth: ^2.1.3
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.2

  # AI / Langchain
  langchain: ^0.7.4
  dart_openai: ^5.1.0

  # Misc Utils
  permission_handler: ^11.3.1
  easy_debounce: ^2.0.3
  youtube_explode_dart: ^2.3.0+1
  store_redirect: ^2.0.1
  fluttertoast: ^8.2.6
  docx_to_text: ^1.0.1
  fuzzywuzzy: ^1.2.0
  flutter_dotenv: ^5.1.0

  # Preview / Dev tools
  device_preview: ^1.2.0

  # File access
  file_picker: ^9.2.3
  signature: ^6.3.0
  slide_to_act: ^2.0.2
  flutter_background: ^1.3.0+1
  cloud_firestore: ^5.6.12
  timeago: ^3.7.1
  intl: ^0.19.0
  uuid: ^4.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svgIcons/
    - assets/pngs/
    - assets/pngImages/
    - assets/fonts/
    - assets/add_tool.gif
    - assets/search.json
    - assets/animated_logo.json
    - assets/onboarding/
    - assets/content.docx
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Poppins-700
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
    - family: Poppins-800
      fonts:
        - asset: assets/fonts/Poppins-ExtraBold.ttf
    - family: Poppins-600
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
    - family: Poppins-500
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Poppins-400
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
    - family: Poppins-300
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
    - family: Poppins-200
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
    - family: Poppins-100
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
